[package]
name = "kite-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Unofficial MCP server for running KITE trade policy scenarios"
repository = "https://github.com/ldocallaghan/kite-mcp"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rmcp = { version = "3.10", features = ["server", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.10", features = ["client", "transport-child-process"] }
tempfile = "3"
