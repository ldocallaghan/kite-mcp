name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  R_VERSION: "4.6.2"

jobs:
  rust:
    name: Rust format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # conformance tests skip themselves here; the next job runs them with R
      - run: cargo test --all-targets

  conformance:
    name: Conformance with KITE and reproduce scripts
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true
      - name: Install R packages and KITE at the pinned commit
        run: Rscript scripts/install-r-deps.R
      - name: Worker tests (R)
        working-directory: worker
        run: Rscript -e 'res <- testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
      - name: Conformance, reproduce-script and REST tests
        run: KITE_MCP_CONFORMANCE=1 cargo test --test conformance --test http -- --nocapture --test-threads=1
      - name: kite-mcp doctor
        run: cargo run --release -- doctor

  eval-score:
    name: Score the saved evaluation transcripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --example score_eval -- score eval

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build --secret id=GITHUB_PAT,env=GITHUB_PAT -t kite-mcp .
      - run: docker run --rm kite-mcp doctor
      - name: MCP over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 docker run -i --rm kite-mcp | tee out.jsonl
          grep -q '"run_scenario"' out.jsonl
